name: Validate task packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable ZIP checking and immutable task versions
        run: python3 tools/test_catalog.py
      - name: Verify source inventories, ZIPs and catalog without executing tasks
        run: python3 tools/build_catalog.py --check
      - name: Verify platform update file hashes
        run: python3 tools/verify_platform_update.py
